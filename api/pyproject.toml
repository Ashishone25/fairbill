[project]
name = "fairbill-api"
version = "0.1.0"
description = "FairBill backend API service for medical bill auditing"
readme = "README.md"
requires-python = ">=3.14"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
